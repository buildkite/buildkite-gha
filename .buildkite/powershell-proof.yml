agents:
  queue: "hosted"

steps:
  - label: ":powershell: PowerShell smoke importer"
    key: "powershell-importer"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.10.17"
    command: |
      set -euo pipefail
      commit="$${COMPATIBILITY_PROOF_COMMIT:-$${SMOKE_COMMIT:-$${BUILDKITE_COMMIT:-}}}"
      scripts/verify-source-checkout "$$commit"
      distribution_root="$$(mktemp -d "$${TMPDIR:-/tmp}/buildkite-gha-powershell.XXXXXXXX")"
      trap 'rm -rf -- "$$distribution_root"' EXIT
      revision="$$(git rev-parse HEAD)"
      for platform in linux windows; do
        CGO_ENABLED=0 GOOS="$$platform" GOARCH=amd64 mise exec -- go build -trimpath -buildvcs=false \
          -ldflags "-X main.revision=$$revision" -o "$$distribution_root/$$platform" ./cmd/buildkite-gha
      done
      "$$distribution_root/linux" upload \
        --event-path testdata/smoke/events/push.json \
        --runtime-distribution "linux/amd64=$$distribution_root/linux" \
        --runtime-distribution "windows/amd64=$$distribution_root/windows" \
        --runner-queue "windows-latest=$${POWERSHELL_WINDOWS_QUEUE:-windows-medium}" \
        .buildkite/fixtures/powershell.yml

  - label: ":pipeline: PowerShell smoke continuation loader"
    key: "powershell-continuation-loader"
    depends_on: "powershell-importer"
    allow_dependency_failure: true
    command: "buildkite-agent pipeline upload .buildkite/powershell-continuation.yml"
