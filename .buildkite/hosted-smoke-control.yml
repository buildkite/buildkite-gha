agents:
  queue: "hosted"

steps:
  - label: ":pipeline: Load hosted smoke aggregator"
    key: "hosted-smoke-aggregator-loader"
    depends_on:
      - step: "shell-upload-continuation-loader"
        allow_failure: true
      - step: "concurrent-steps-continuation-loader"
        allow_failure: true
      - step: "public-actions-continuation-loader"
        allow_failure: true
      - step: "hosted-docker-continuation-loader"
        allow_failure: true
      - step: "dockerfile-action-continuation-loader"
        allow_failure: true
      - step: "container-runtime-continuation-loader"
        allow_failure: true
      - step: "summary-annotation-continuation-loader"
        allow_failure: true
      - step: "workflow-annotations-continuation-loader"
        allow_failure: true
      - step: "upload-artifact-continuation-loader"
        allow_failure: true
      - step: "artifact-roundtrip-continuation-loader"
        allow_failure: true
    command: "buildkite-agent pipeline upload .buildkite/hosted-smoke-aggregator.yml"
