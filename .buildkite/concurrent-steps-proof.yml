agents:
  queue: "hosted"

steps:
  - label: ":pipeline: Concurrent steps proof importer"
    key: "concurrent-steps-importer"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: |
      set -euo pipefail
      commit="$${COMPATIBILITY_PROOF_COMMIT:-$${SMOKE_COMMIT:-}}"
      scripts/verify-source-checkout "$$commit"
      distribution_root="$$(mktemp -d "$${TMPDIR:-/tmp}/buildkite-gha-concurrent-steps.XXXXXXXX")"
      trap 'rm -rf -- "$$distribution_root"' EXIT
      revision="$$(git rev-parse HEAD)"
      CGO_ENABLED=0 mise exec -- go build -trimpath -buildvcs=false -ldflags "-X main.revision=$$revision" -o "$$distribution_root/buildkite-gha" ./cmd/buildkite-gha
      "$$distribution_root/buildkite-gha" upload \
        --event-path testdata/smoke/events/push.json \
        --runner-queue ubuntu-latest=hosted \
        testdata/smoke/.github/workflows/concurrent.yml

  - label: ":pipeline: Concurrent steps proof continuation loader"
    key: "concurrent-steps-continuation-loader"
    depends_on: "concurrent-steps-importer"
    allow_dependency_failure: true
    command: "buildkite-agent pipeline upload .buildkite/concurrent-steps-continuation.yml"
