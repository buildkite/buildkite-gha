agents:
  queue: "hosted"

steps:
  - label: ":pipeline: Phase 2 unprivileged importer"
    key: "phase-2-upload-importer"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: |
      set -euo pipefail
      commit="$${PHASE2_COMMIT:-$${SMOKE_COMMIT:-}}"
      scripts/phase-0-shell-oracle-checkout "$$commit"
      case "$${PHASE2_WORKFLOW:-shell}" in
        shell)
          workflow="testdata/smoke/.github/workflows/shell.yml"
          event="testdata/smoke/events/push.json"
          ;;
        cache)
          workflow="testdata/smoke/.github/workflows/cache.yml"
          event="testdata/smoke/events/push.json"
          ;;
        cache-v3)
          workflow="testdata/cache-canaries/.github/workflows/cache-v3.yml"
          event="testdata/smoke/events/push.json"
          ;;
        notion-cli)
          workflow="testdata/notion-cli/.github/workflows/ci.yml"
          event="testdata/notion-cli/events/push.json"
          ;;
        setup-node-cache)
          workflow="testdata/cache-canaries/.github/workflows/setup-node.yml"
          event="testdata/phase4/events/public-checkout.json"
          ;;
        setup-go-cache)
          workflow="testdata/cache-canaries/.github/workflows/setup-go.yml"
          event="testdata/notion-cli/events/push.json"
          ;;
        *) echo "unsupported PHASE2_WORKFLOW: $${PHASE2_WORKFLOW}" >&2; exit 1 ;;
      esac
      distribution_root="$$(mktemp -d "$${TMPDIR:-/tmp}/buildkite-gha-phase2.XXXXXXXX")"
      trap 'rm -rf -- "$$distribution_root"' EXIT
      CGO_ENABLED=0 mise exec -- go build -trimpath -buildvcs=false -o "$$distribution_root/buildkite-gha" ./cmd/buildkite-gha
      "$$distribution_root/buildkite-gha" upload \
        --event-path "$$event" \
        --runtime-queue hosted \
        "$$workflow"

  - label: ":pipeline: Phase 2 continuation loader"
    key: "phase-2-continuation-loader"
    if: build.env("PHASE2_WORKFLOW") == null || build.env("PHASE2_WORKFLOW") == "shell"
    depends_on: "phase-2-upload-importer"
    allow_dependency_failure: true
    command: "buildkite-agent pipeline upload .buildkite/phase-2-upload-continuation.yml"
