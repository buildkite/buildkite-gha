agents:
  queue: hosted
steps:
  - label: "PB-3064 native Namespace production smoke importer"
    key: pb3064-importer
    timeout_in_minutes: 35
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: |
      set -euo pipefail
      source_commit=f6e11c834dc0258c1248d3cacce82c9f33f27354
      git diff --exit-code "$$source_commit" -- cmd internal go.mod go.sum
      work="$$(mktemp -d)"
      trap 'rm -rf "$$work"' EXIT
      CGO_ENABLED=0 mise exec -- go build -trimpath -buildvcs=false -ldflags "-X main.version=0.0.0-pb3064.$$source_commit -X main.revision=$$source_commit" -o "$$work/buildkite-gha" ./cmd/buildkite-gha
      python3 scripts/pb3064-native-smoke.py "$$work/buildkite-gha"
