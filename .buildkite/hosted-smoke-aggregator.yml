agents:
  queue: "hosted"

steps:
  - label: ":white_check_mark: Hosted smoke targets settled"
    key: "hosted-smoke-terminal"
    depends_on:
      - step: "gha-producer"
        allow_failure: true
      - step: "gha-consumer-5ebbc197d87b"
        allow_failure: true
      - step: "gha-consumer-91934b28b00f"
        allow_failure: true
      - step: "gha-concurrent"
        allow_failure: true
      - step: "gha-observe"
        allow_failure: true
      - step: "gha-public-actions"
        allow_failure: true
      - step: "hosted-docker-probe"
        allow_failure: true
      - step: "gha-docker-action"
        allow_failure: true
      - step: "container-runtime-probe"
        allow_failure: true
      - step: "gha-summary-annotation"
        allow_failure: true
      - step: "gha-workflow-command-annotations"
        allow_failure: true
      - step: "gha-upload-artifact"
        allow_failure: true
      - step: "gha-artifact-producer"
        allow_failure: true
      - step: "gha-artifact-consumer-5ebbc197d87b"
        allow_failure: true
      - step: "gha-artifact-consumer-91934b28b00f"
        allow_failure: true
      - step: "shell-upload-complete"
        allow_failure: true
      - step: "concurrent-steps-complete"
        allow_failure: true
      - step: "public-actions-complete"
        allow_failure: true
      - step: "hosted-docker-complete"
        allow_failure: true
      - step: "dockerfile-action-complete"
        allow_failure: true
      - step: "container-runtime-complete"
        allow_failure: true
      - step: "summary-annotation-complete"
        allow_failure: true
      - step: "workflow-annotations-complete"
        allow_failure: true
      - step: "upload-artifact-complete"
        allow_failure: true
      - step: "artifact-roundtrip-complete"
        allow_failure: true
    command: |
      set -euo pipefail
      failed=0
      for step in \
        gha-producer \
        gha-consumer-5ebbc197d87b \
        gha-consumer-91934b28b00f \
        gha-concurrent \
        gha-observe \
        gha-public-actions \
        hosted-docker-probe \
        gha-docker-action \
        container-runtime-probe \
        gha-summary-annotation \
        gha-workflow-command-annotations \
        gha-upload-artifact \
        gha-artifact-producer \
        gha-artifact-consumer-5ebbc197d87b \
        gha-artifact-consumer-91934b28b00f \
        shell-upload-complete \
        concurrent-steps-complete \
        public-actions-complete \
        hosted-docker-complete \
        dockerfile-action-complete \
        container-runtime-complete \
        summary-annotation-complete \
        workflow-annotations-complete \
        upload-artifact-complete \
        artifact-roundtrip-complete
      do
        outcome="$$(buildkite-agent step get "outcome" --step "$$step")"
        printf '%s: %s\n' "$$step" "$$outcome"
        [[ "$$outcome" == passed ]] || failed=1
      done
      if (( failed != 0 )); then
        echo 'One or more hosted smoke targets failed' >&2
        exit 1
      fi
      echo 'All hosted smoke targets passed'
