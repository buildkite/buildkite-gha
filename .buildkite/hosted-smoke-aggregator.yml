agents:
  queue: "hosted"

steps:
  - label: ":white_check_mark: Hosted smoke targets settled"
    key: "hosted-smoke-terminal"
    depends_on:
      - step: "gha-producer"
        allow_failure: true
      - step: "gha-consumer-5ebbc197d87b"
        allow_failure: true
      - step: "gha-consumer-91934b28b00f"
        allow_failure: true
      - step: "gha-concurrent"
        allow_failure: true
      - step: "gha-observe"
        allow_failure: true
      - step: "gha-public-actions"
        allow_failure: true
      - step: "phase-5-hosted-docker-probe"
        allow_failure: true
      - step: "gha-docker-action"
        allow_failure: true
      - step: "phase-5-hosted-runtime-probe"
        allow_failure: true
      - step: "gha-summary-annotation"
        allow_failure: true
      - step: "gha-workflow-command-annotations"
        allow_failure: true
      - step: "gha-upload-artifact"
        allow_failure: true
      - step: "gha-artifact-producer"
        allow_failure: true
      - step: "gha-artifact-consumer-5ebbc197d87b"
        allow_failure: true
      - step: "gha-artifact-consumer-91934b28b00f"
        allow_failure: true
      - step: "phase-2-native-after-shell"
        allow_failure: true
      - step: "phase-3-native-after-concurrent"
        allow_failure: true
      - step: "phase-4-native-after-actions"
        allow_failure: true
      - step: "phase-5-native-after-hosted-docker"
        allow_failure: true
      - step: "phase-5-native-after-docker-action"
        allow_failure: true
      - step: "phase-5-native-after-runtime"
        allow_failure: true
      - step: "phase-6-native-after-summary"
        allow_failure: true
      - step: "phase-6-native-after-annotations"
        allow_failure: true
      - step: "phase-6-native-after-upload-artifact"
        allow_failure: true
      - step: "phase-6-native-after-artifact-roundtrip"
        allow_failure: true
    command: |
      set -euo pipefail
      failed=0
      for step in \
        gha-producer \
        gha-consumer-5ebbc197d87b \
        gha-consumer-91934b28b00f \
        gha-concurrent \
        gha-observe \
        gha-public-actions \
        phase-5-hosted-docker-probe \
        gha-docker-action \
        phase-5-hosted-runtime-probe \
        gha-summary-annotation \
        gha-workflow-command-annotations \
        gha-upload-artifact \
        gha-artifact-producer \
        gha-artifact-consumer-5ebbc197d87b \
        gha-artifact-consumer-91934b28b00f \
        phase-2-native-after-shell \
        phase-3-native-after-concurrent \
        phase-4-native-after-actions \
        phase-5-native-after-hosted-docker \
        phase-5-native-after-docker-action \
        phase-5-native-after-runtime \
        phase-6-native-after-summary \
        phase-6-native-after-annotations \
        phase-6-native-after-upload-artifact \
        phase-6-native-after-artifact-roundtrip
      do
        outcome="$$(buildkite-agent step get "outcome" --step "$$step")"
        printf '%s: %s\n' "$$step" "$$outcome"
        [[ "$$outcome" == passed ]] || failed=1
      done
      if (( failed != 0 )); then
        echo 'One or more hosted smoke targets failed' >&2
        exit 1
      fi
      echo 'All hosted smoke targets passed'
