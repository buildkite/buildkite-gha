agents:
  queue: "hosted"

steps:
  - label: ":warning: Workflow command annotation importer"
    key: "workflow-annotations-importer"
    timeout_in_minutes: 15
    retry:
      automatic: false
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: |
      set -euo pipefail
      commit="$${COMPATIBILITY_PROOF_COMMIT:-$${SMOKE_COMMIT:-$${BUILDKITE_COMMIT:?BUILDKITE_COMMIT is required}}}"
      scripts/verify-source-checkout "$$commit"
      test -z "$$(git status --porcelain --untracked-files=all)"
      distribution_root="$$(mktemp -d "$${TMPDIR:-/tmp}/buildkite-gha-workflow-annotations.XXXXXXXX")"
      trap 'rm -rf -- "$$distribution_root"' EXIT
      runtime_version="0.0.0-workflow-annotations.$$commit"
      CGO_ENABLED=0 mise exec -- go build -trimpath -buildvcs=false -ldflags "-X main.version=$$runtime_version" -o "$$distribution_root/buildkite-gha" ./cmd/buildkite-gha
      "$$distribution_root/buildkite-gha" upload \
        --event-path testdata/smoke/events/push.json \
        --runner-queue ubuntu-latest=hosted \
        testdata/smoke/.github/workflows/workflow-command-annotations.yml

  - label: ":pipeline: Workflow command annotation continuation loader"
    key: "workflow-annotations-continuation-loader"
    depends_on: "workflow-annotations-importer"
    allow_dependency_failure: true
    command: "buildkite-agent pipeline upload .buildkite/workflow-annotations-continuation.yml"
