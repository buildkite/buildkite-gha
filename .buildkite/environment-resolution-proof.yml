agents:
  queue: "hosted"

steps:
  - label: ":github: Environment snapshot compile proof"
    key: "environment-resolution"
    timeout_in_minutes: 10
    retry:
      automatic: false
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: |
      set -euo pipefail
      commit="$${COMPATIBILITY_PROOF_COMMIT:?COMPATIBILITY_PROOF_COMMIT is required}"
      scripts/verify-source-checkout "$$commit"
      test -z "$$(git status --porcelain --untracked-files=all)"
      distribution_root="$$(mktemp -d "$${TMPDIR:-/tmp}/buildkite-gha-environment-resolution.XXXXXXXX")"
      trap 'rm -rf -- "$$distribution_root"' EXIT
      runtime_version="0.0.0-environment-resolution.$$commit"
      CGO_ENABLED=0 mise exec -- go build -trimpath -buildvcs=false -ldflags "-X main.version=$$runtime_version" -o "$$distribution_root/buildkite-gha" ./cmd/buildkite-gha
      pipeline="$$distribution_root/pipeline.yml"
      "$$distribution_root/buildkite-gha" compile \
        --event-path testdata/smoke/events/push.json \
        .buildkite/fixtures/environment-resolution.yml > "$$pipeline"
      grep -Fq 'key: "gha-environment-snapshot"' "$$pipeline"
      grep -Eq '\.buildkite-gha/plans/[0-9a-f]{64}\.json' "$$pipeline"
      if grep -Fq 'block:' "$$pipeline"; then
        echo 'The unprotected test environment unexpectedly emitted an approval block' >&2
        exit 1
      fi
      echo 'The live test environment resolved and compiled one ungated job plan'
