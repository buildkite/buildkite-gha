name: PowerShell smoke

on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  powershell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Run PowerShell without a setup action
        id: run
        shell: pwsh
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core') { throw 'PowerShell Core required' }
          'GREETING=héllo 世界' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'answer=42' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "PWSH_RUNTIME=$($PSVersionTable.PSVersion) OS=$env:RUNNER_OS"

      - name: Stop on PowerShell errors
        id: failure
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Error 'Expected smoke-test failure'
          Set-Content should-not-exist 'error handling failed'

      - name: Verify environment, outputs, and error handling
        shell: pwsh
        env:
          ANSWER: ${{ steps.run.outputs.answer }}
          OUTCOME: ${{ steps.failure.outcome }}
        run: |
          if ($env:GREETING -ne 'héllo 世界') { throw 'environment lost' }
          if ($env:ANSWER -ne '42') { throw 'output lost' }
          if ($env:OUTCOME -ne 'failure') { throw 'failure outcome lost' }
          if (Test-Path should-not-exist) { throw 'Write-Error did not stop execution' }
          & pwsh -NoProfile -NonInteractive -Command 'exit 0'
          if ($LASTEXITCODE -ne 0) { throw 'nested pwsh is unavailable' }
          Write-Output 'POWERSHELL_SMOKE_OK'
