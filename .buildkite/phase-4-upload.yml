steps:
  - label: ":pipeline: Phase 4 actions importer"
    key: "phase-4-upload-importer"
    agents:
      queue: "elastic-runners"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: |
      set -euo pipefail
      scripts/phase-0-shell-oracle-checkout "$$PHASE4_COMMIT"
      test -z "$$(git status --porcelain --untracked-files=all)"
      distribution_root="$$(mktemp -d "$${TMPDIR:-/tmp}/buildkite-gha-phase4.XXXXXXXX")"
      trap 'rm -rf -- "$$distribution_root"' EXIT
      runtime_version="phase4-$${PHASE4_COMMIT}"
      mise exec -- go build -trimpath -buildvcs=false -ldflags "-X main.version=$$runtime_version" -o "$$distribution_root/buildkite-gha" ./cmd/buildkite-gha
      mise exec -- go run ./internal/harness/cmd/phase4-upload \
        --event-path testdata/smoke/events/push.json \
        --runtime "$$distribution_root/buildkite-gha" \
        --runtime-version "$$runtime_version" \
        --runtime-queue hosted \
        --node24 "$$(mise where node@24)/bin/node" \
        --commit "$$PHASE4_COMMIT" \
        .github/workflows/phase-4-actions-oracle.yml

  - label: ":pipeline: Phase 4 continuation loader"
    key: "phase-4-continuation-loader"
    depends_on: "phase-4-upload-importer"
    agents:
      queue: "elastic-runners"
    command: "buildkite-agent pipeline upload .buildkite/phase-4-upload-continuation.yml"
