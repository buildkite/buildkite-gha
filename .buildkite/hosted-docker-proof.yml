agents:
  queue: "hosted"

steps:
  - label: ":pipeline: Hosted Docker importer"
    key: "hosted-docker-importer"
    command: |
      set -euo pipefail
      commit="$${COMPATIBILITY_PROOF_COMMIT:-$${SMOKE_COMMIT:-$${BUILDKITE_COMMIT:?BUILDKITE_COMMIT is required}}}"
      scripts/verify-source-checkout "$$commit"
      test -z "$$(git status --porcelain --untracked-files=all)"
      buildkite-agent pipeline upload --no-interpolation --reject-secrets .buildkite/hosted-docker-probe.yml

  - label: ":pipeline: Hosted Docker continuation loader"
    key: "hosted-docker-continuation-loader"
    depends_on: "hosted-docker-importer"
    allow_dependency_failure: true
    command: "buildkite-agent pipeline upload .buildkite/hosted-docker-continuation.yml"
