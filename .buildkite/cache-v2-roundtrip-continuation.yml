agents:
  queue: "hosted"

steps:
  - label: ":white_check_mark: Cache v2 roundtrip settled"
    key: "cache-v2-roundtrip-complete"
    depends_on:
      - step: "gha-cache-producer"
        allow_failure: true
      - step: "gha-cache-consumer"
        allow_failure: true
    command: |
      set -euo pipefail
      for step in gha-cache-producer gha-cache-consumer; do
        outcome="$$(buildkite-agent step get "outcome" --step "$$step")"
        printf '%s: %s\n' "$$step" "$$outcome"
        test "$$outcome" = passed
      done
      echo 'The actions/cache v3.4.0 producer and v6.1.0 consumer passed.'
