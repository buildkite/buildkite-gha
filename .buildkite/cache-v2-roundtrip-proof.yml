agents:
  queue: "hosted"

steps:
  - label: ":package: Cache v2 roundtrip importer"
    key: "cache-v2-roundtrip-importer"
    timeout_in_minutes: 15
    retry:
      automatic: false
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: |
      set -euo pipefail
      commit="$${COMPATIBILITY_PROOF_COMMIT:-$${SMOKE_COMMIT:-}}"
      scripts/verify-source-checkout "$$commit"
      test -z "$$(git status --porcelain --untracked-files=all)"
      distribution_root="$$(mktemp -d "$${TMPDIR:-/tmp}/buildkite-gha-cache-v2-roundtrip.XXXXXXXX")"
      proof_workflow=
      trap 'rm -rf -- "$$distribution_root"; [[ -z "$$proof_workflow" ]] || rm -f -- "$$proof_workflow"' EXIT
      runtime_version="0.0.0-cache-v2-roundtrip.$$commit"
      CGO_ENABLED=0 mise exec -- go build -trimpath -buildvcs=false -ldflags "-X main.version=$$runtime_version" -o "$$distribution_root/buildkite-gha" ./cmd/buildkite-gha
      proof_workflow="$$(mktemp testdata/smoke/.github/workflows/.cache-v2-roundtrip.XXXXXXXX.yml)"
      nonce="$${BUILDKITE_BUILD_NUMBER:?BUILDKITE_BUILD_NUMBER is required}"
      sed "s/__CACHE_ROUNDTRIP_NONCE__/$$nonce/g" testdata/smoke/.github/workflows/cache-v2-compatibility.yml > "$$proof_workflow"
      ! grep -q '__CACHE_ROUNDTRIP_NONCE__' "$$proof_workflow"
      "$$distribution_root/buildkite-gha" upload \
        --event-path testdata/smoke/events/push.json \
        --runner-queue ubuntu-latest=hosted \
        "$$proof_workflow"

  - label: ":pipeline: Cache v2 roundtrip continuation loader"
    key: "cache-v2-roundtrip-continuation-loader"
    depends_on: "cache-v2-roundtrip-importer"
    allow_dependency_failure: true
    command: "buildkite-agent pipeline upload .buildkite/cache-v2-roundtrip-continuation.yml"
