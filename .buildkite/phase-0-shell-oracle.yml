steps:
  - label: ":git: Materialize exact shell fixture"
    key: phase-0-shell-prepare
    timeout_in_minutes: 10
    command: |
      set -euo pipefail
      scripts/phase-0-shell-oracle-checkout "$$ORACLE_SOURCE_COMMIT"
      fixture_commit=$$(go run ./internal/harness/cmd/shell-oracle materialize --source testdata/smoke)
      buildkite-agent meta-data set phase-0-shell-fixture-commit "$$fixture_commit"
      printf 'Materialized shell fixture commit: %s\n' "$$fixture_commit"

  - label: ":pipeline: Produce bounded shell output"
    key: phase-0-shell-producer
    depends_on: phase-0-shell-prepare
    timeout_in_minutes: 5
    command: |
      set -euo pipefail
      scripts/phase-0-shell-oracle-checkout "$$ORACLE_SOURCE_COMMIT"
      buildkite-agent meta-data set phase-0-shell-result smoke-shell

  - label: ":mag: Capture shell observation one"
    key: phase-0-shell-consumer-one
    depends_on: phase-0-shell-producer
    timeout_in_minutes: 5
    command: |
      set -euo pipefail
      scripts/phase-0-shell-oracle-checkout "$$ORACLE_SOURCE_COMMIT"
      result=$$(buildkite-agent meta-data get phase-0-shell-result)
      test "$$result" = "smoke-shell"
      mkdir -p phase-0-shell-observations
      printf 'SMOKE_OBSERVATION={"result":"%s","variant":"one"}\n' "$$result" \
        | tee phase-0-shell-observations/observation-one.log
      buildkite-agent artifact upload "phase-0-shell-observations/observation-one.log"

  - label: ":mag: Capture shell observation two"
    key: phase-0-shell-consumer-two
    depends_on: phase-0-shell-producer
    timeout_in_minutes: 5
    command: |
      set -euo pipefail
      scripts/phase-0-shell-oracle-checkout "$$ORACLE_SOURCE_COMMIT"
      result=$$(buildkite-agent meta-data get phase-0-shell-result)
      test "$$result" = "smoke-shell"
      mkdir -p phase-0-shell-observations
      printf 'SMOKE_OBSERVATION={"result":"%s","variant":"two"}\n' "$$result" \
        | tee phase-0-shell-observations/observation-two.log
      buildkite-agent artifact upload "phase-0-shell-observations/observation-two.log"

  - label: ":white_check_mark: Normalize and compare shell observations"
    key: phase-0-shell-compare
    depends_on:
      - phase-0-shell-consumer-one
      - phase-0-shell-consumer-two
    timeout_in_minutes: 10
    command: |
      set -euo pipefail
      scripts/phase-0-shell-oracle-checkout "$$ORACLE_SOURCE_COMMIT"
      mkdir -p phase-0-shell-observations
      buildkite-agent artifact download \
        "phase-0-shell-observations/observation-one.log" . \
        --step phase-0-shell-consumer-one
      buildkite-agent artifact download \
        "phase-0-shell-observations/observation-two.log" . \
        --step phase-0-shell-consumer-two
      fixture_commit=$$(buildkite-agent meta-data get phase-0-shell-fixture-commit)
      cat \
        phase-0-shell-observations/observation-one.log \
        phase-0-shell-observations/observation-two.log \
        | go run ./internal/harness/cmd/shell-oracle compare \
            --source testdata/smoke \
            --commit "$$fixture_commit" \
            --provider buildkite \
        | tee phase-0-shell-normalized.json
