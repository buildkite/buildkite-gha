agents:
  queue: hosted

steps:
  - label: ":test_tube: Controlled error-report delivery proof"
    key: error-report-proof
    timeout_in_minutes: 15
    retry:
      automatic: false
    artifact_paths:
      - error-report-proof.json
    plugins:
      - setup-go#v0.1.1:
          mise-version: "2026.10.17"
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.10.17"
    command: |
      set -euo pipefail
      mkdir -p .amp/in/orb-backup
      version=dev+error-report-pre-release-d5bef279
      binary=.amp/in/orb-backup/buildkite-gha
      CGO_ENABLED=0 mise exec -- go build -trimpath -ldflags "-X main.version=$$version" -o "$$binary" ./cmd/buildkite-gha
      digest="$$(sha256sum "$$binary" | cut -d' ' -f1)"
      python3 .buildkite/error-report-proof.py --binary "$$binary" --sha256 "$$digest" --version "$$version" | tee error-report-proof.json
