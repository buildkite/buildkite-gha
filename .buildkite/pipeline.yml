agents:
  queue: hosted

steps:
  - label: ":test_tube: Controlled error-report delivery proof"
    key: error-report-proof
    timeout_in_minutes: 15
    retry:
      automatic: false
    artifact_paths:
      - error-report-proof.json
    command: |
      set -euo pipefail
      mkdir -p .amp/in/orb-backup
      version=v0.135.0
      binary=.amp/in/orb-backup/buildkite-gha
      # Exact GitHub release asset digest, not a locally rebuilt executable.
      digest=6d02417367748491d73f566a4ccbcadc51d99aac15cf888359235e8c03c4c1d1
      curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
        "https://github.com/buildkite/buildkite-gha/releases/download/$$version/buildkite-gha_linux_x86_64" --output "$$binary"
      printf '%s  %s\n' "$$digest" "$$binary" | sha256sum --check -
      chmod +x "$$binary"
      python3 .buildkite/error-report-proof.py --binary "$$binary" --sha256 "$$digest" --version "$$version" | tee error-report-proof.json
