# Temporary PB-3812 proof branch: runs only the job output size proof.
env:
  MISE_JOBS: "1"
  MISE_LOCKED: "1"

agents:
  queue: "hosted"

steps:
  - label: ":pipeline: Job output size proof importer"
    key: "output-size-proof-importer"
    timeout_in_minutes: 10
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: |
      set -euo pipefail
      distribution_root="$$(mktemp -d "$${TMPDIR:-/tmp}/buildkite-gha-output-size.XXXXXXXX")"
      trap 'rm -rf -- "$$distribution_root"' EXIT
      revision="$$(git rev-parse HEAD)"
      CGO_ENABLED=0 mise exec -- go build -trimpath -buildvcs=false -ldflags "-X main.revision=$$revision" -o "$$distribution_root/buildkite-gha" ./cmd/buildkite-gha
      "$$distribution_root/buildkite-gha" upload \
        --event-path testdata/smoke/events/push.json \
        --runner-queue ubuntu-latest=hosted \
        testdata/output-size/.github/workflows/output-size.yml
