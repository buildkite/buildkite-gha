steps:
  - label: ":github: Import workflow"
    key: "skipped-workflow-annotation"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: >-
      mise exec -- go run ./cmd/buildkite-gha upload
      --event push
      --ref refs/heads/annotate-skipped-workflows
      --commit "$${BUILDKITE_COMMIT}"
      --workflows .github/workflows/example-basic.yml
      --runner runs-on=ubuntu-latest,queue=hosted
