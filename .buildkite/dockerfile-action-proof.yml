agents:
  queue: "hosted"

steps:
  - label: ":pipeline: Dockerfile action importer"
    key: "dockerfile-action-importer"
    env:
      BUILDKITE_GHA_TARGET_QUEUE: "hosted"
    timeout_in_minutes: 15
    retry:
      automatic: false
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: |
      set -euo pipefail
      commit="$${COMPATIBILITY_PROOF_COMMIT:-$${SMOKE_COMMIT:-}}"
      scripts/verify-source-checkout "$$commit"
      test -z "$$(git status --porcelain --untracked-files=all)"
      proof_root="$$(mktemp -d "$${TMPDIR:-/tmp}/buildkite-gha-dockerfile-action.XXXXXXXX")"
      trap 'rm -rf -- "$$proof_root"' EXIT
      mkdir -p "$$proof_root/.github/workflows"
      cp testdata/dockerfile-action/.github/workflows/docker-action.yml.tmpl \
        "$$proof_root/.github/workflows/docker-action.yml"
      runtime_version="0.0.0-dockerfile-action.$$commit"
      CGO_ENABLED=0 mise exec -- go build -trimpath -buildvcs=false -ldflags "-X main.version=$$runtime_version" -o "$$proof_root/buildkite-gha" ./cmd/buildkite-gha
      BUILDKITE_GHA_NODE20="$$(mise where node@20)/bin/node" \
      BUILDKITE_GHA_NODE24="$$(mise where node@24)/bin/node" \
      "$$proof_root/buildkite-gha" upload \
        --event-path testdata/smoke/events/push.json \
        --runtime-queue hosted \
        "$$proof_root/.github/workflows/docker-action.yml"

  - label: ":pipeline: Dockerfile action continuation loader"
    key: "dockerfile-action-continuation-loader"
    depends_on: "dockerfile-action-importer"
    allow_dependency_failure: true
    command: "buildkite-agent pipeline upload .buildkite/dockerfile-action-continuation.yml"
