name: Released plugin demo - cache extension

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXAMPLE_CACHE_KEY: plugin-demo-v1-${{ github.sha }}
  EXAMPLE_CACHE_PAYLOAD: plugin-demo-cache:${{ github.sha }}

jobs:
  cache-producer:
    name: Populate dependency cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore release-commit cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugin-demo-cache
          key: ${{ env.EXAMPLE_CACHE_KEY }}

      - name: Create or verify payload
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == true ]]; then
            test "$(cat plugin-demo-cache/payload.txt)" = "$EXAMPLE_CACHE_PAYLOAD"
          else
            mkdir -p plugin-demo-cache
            printf '%s\n' "$EXAMPLE_CACHE_PAYLOAD" > plugin-demo-cache/payload.txt
          fi

  cache-consumer:
    name: Restore dependency cache
    needs: cache-producer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore producer cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugin-demo-cache
          key: ${{ env.EXAMPLE_CACHE_KEY }}

      - name: Require exact cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test "$(cat plugin-demo-cache/payload.txt)" = "$EXAMPLE_CACHE_PAYLOAD"

      - name: Publish cache summary
        shell: bash
        run: |
          {
            echo '## Released plugin cache demo'
            echo
            echo 'The dependent job restored the exact actions/cache v6 entry.'
          } >> "$GITHUB_STEP_SUMMARY"

  plugin-demo-cache:
    name: Cache demo complete
    needs: cache-consumer
    runs-on: ubuntu-latest
    steps:
      - name: Confirm cache roundtrip
        shell: bash
        run: echo 'Cache producer and consumer completed.'
