name: Container runtime proof

on:
  push:

jobs:
  container-runtime:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm-slim
      env:
        CONTAINER_RUNTIME_ENV: literal
    services:
      redis:
        image: redis@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
        ports:
          - 6380
        options: >-
          --health-cmd "redis-cli -p 6380 ping"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 10
        entrypoint: sh
        command: -c "sleep 3; exec redis-server --port 6380"
      writer:
        image: busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
        volumes:
          - parity-data:/shared
        entrypoint: sh
        command: -c "printf service-volume > /shared/marker; exec sleep 300"
        options: >-
          --health-cmd "test -f /shared/marker"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 10
      reader:
        image: busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
        volumes:
          - parity-data:/shared:ro
        ports:
          - 8080
        entrypoint: sh
        command: -c "while [ ! -f /shared/marker ]; do sleep .1; done; exec httpd -f -p 8080 -h /shared"
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8080/marker"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 10
    outputs:
      observation: ${{ steps.verify.outputs.observation }}
    steps:
      - name: Establish persistent container state
        id: shell
        shell: sh
        run: |
          test "$GITHUB_WORKSPACE" = /__w/repo/repo
          test "$RUNNER_TEMP" = /__w/_temp
          test "$CONTAINER_RUNTIME_ENV" = literal
          printf '%s\n' persisted > container-runtime-persisted
          echo 'CONTAINER_RUNTIME_SHELL_ENV=seen' >> "$GITHUB_ENV"
          echo 'value=shell' >> "$GITHUB_OUTPUT"

      - name: Reach service by job-network alias
        shell: sh
        env:
          REDIS_ID: ${{ job.services.redis.id }}
          REDIS_NETWORK: ${{ job.services.redis.network }}
        run: |
          test -n "$REDIS_ID"
          test -n "$REDIS_NETWORK"
          test -f container-runtime-persisted
          test "$CONTAINER_RUNTIME_SHELL_ENV" = seen
          node <<'NODE'
          const net = require('node:net');
          const socket = net.createConnection(6380, 'redis');
          socket.setTimeout(1000);
          socket.once('connect', () => socket.write('*1\r\n$4\r\nPING\r\n'));
          socket.once('data', (data) => process.exit(data.toString().includes('+PONG') ? 0 : 1));
          socket.once('timeout', () => process.exit(1));
          socket.once('error', () => process.exit(1));
          NODE
          node <<'NODE'
          const http = require('node:http');
          const request = http.get('http://reader:8080/marker', { timeout: 1000 }, response => {
            let body = '';
            response.on('data', chunk => body += chunk);
            response.on('end', () => process.exit(body === 'service-volume' ? 0 : 1));
          });
          request.on('timeout', () => { request.destroy(); process.exit(1); });
          request.on('error', () => process.exit(1));
          NODE

      - name: Run JavaScript lifecycle
        id: javascript
        uses: ./.github/actions/javascript
        with:
          message: container-runtime

      - name: Run composite action
        id: composite
        uses: ./.github/actions/composite
        with:
          message: ${{ steps.javascript.outputs.result }}

      - name: Run sibling Dockerfile action
        id: docker
        uses: ./.github/actions/docker
        with:
          expected_file: container-runtime-persisted
          service_host: redis
          service_port: 6380

      - name: Verify container observations
        id: verify
        shell: sh
        env:
          JAVASCRIPT_RESULT: ${{ steps.javascript.outputs.result }}
          COMPOSITE_RESULT: ${{ steps.composite.outputs.result }}
          DOCKER_RESULT: ${{ steps.docker.outputs.container }}
        run: |
          test "$JAVASCRIPT_RESULT" = container-runtime-javascript
          test "$COMPOSITE_RESULT" = container-runtime-javascript-composite
          test "$DOCKER_RESULT" = ran
          test "$CONTAINER_RUNTIME_JAVASCRIPT_ENV" = seen
          test "$CONTAINER_RUNTIME_COMPOSITE_ENV" = seen
          test "$CONTAINER_RUNTIME_DOCKER_ENV" = seen
          echo 'observation=container-runtime' >> "$GITHUB_OUTPUT"

  host-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        optional-service: [""]
    services:
      redis:
        image: redis@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
        ports:
          - 6380
        options: --health-cmd "redis-cli -p 6380 ping" --health-interval 1s --health-timeout 2s --health-retries 10
        entrypoint: sh
        command: -c "sleep 3; exec redis-server --port 6380"
      optional:
        image: ${{ matrix.optional-service }}
    outputs:
      observation: ${{ steps.verify.outputs.observation }}
    steps:
      - name: Reach service through loopback publication
        shell: bash
        env:
          REDIS_PORT: ${{ job.services.redis.ports[6380] }}
          REDIS_ID: ${{ job.services.redis.id }}
          REDIS_NETWORK: ${{ job.services.redis.network }}
        run: |
          test -n "$REDIS_PORT"
          test -n "$REDIS_ID"
          test -n "$REDIS_NETWORK"
          exec 3<>"/dev/tcp/127.0.0.1/$REDIS_PORT"
          printf '*1\r\n$4\r\nPING\r\n' >&3
          IFS= read -r -t 1 reply <&3
          test "$reply" = $'+PONG\r'

      - name: Reach service from sibling Dockerfile action
        id: docker
        uses: ./.github/actions/docker
        with:
          expected_file: .github/workflows/runtime.yml
          service_host: redis
          service_port: 6380

      - name: Verify host observations
        id: verify
        shell: bash
        env:
          DOCKER_RESULT: ${{ steps.docker.outputs.container }}
        run: |
          test "$GITHUB_WORKSPACE" != /__w/repo/repo
          test "$DOCKER_RESULT" = ran
          test "$CONTAINER_RUNTIME_DOCKER_ENV" = seen
          echo 'observation=host-runtime' >> "$GITHUB_OUTPUT"
