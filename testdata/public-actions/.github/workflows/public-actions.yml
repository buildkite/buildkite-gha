name: Public actions proof

on:
  push:

permissions:
  contents: read

jobs:
  public-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact public event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify anonymous checkout identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
          test "$(git remote get-url origin)" = "https://github.com/actions/checkout.git"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: "false"
          token: ""

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache: "false"
          token: ""

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          token: ""

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          token: ""

      - name: Verify portable setup actions
        shell: bash
        run: |
          node --version | grep '^v24\.'
          go version | grep 'go1\.26\.5 '
          python --version | grep '^Python 3\.13\.'
          java -version 2>&1 | grep 'version "21\.'
