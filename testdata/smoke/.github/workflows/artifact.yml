name: buildkite-gha artifact smoke

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARTIFACT_ROUNDTRIP_PAYLOAD: smoke-artifact:__ARTIFACT_ROUNDTRIP_NONCE__

jobs:
  artifact-producer:
    runs-on: ubuntu-latest
    steps:
      - name: Create payload
        shell: bash
        run: |
          mkdir -p payload
          printf '%s\n' "$ARTIFACT_ROUNDTRIP_PAYLOAD" > payload/result.txt

      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-payload
          path: payload/result.txt
          if-no-files-found: error

  artifact-consumer:
    needs: artifact-producer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [one, two]
    steps:
      - name: Download payload
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smoke-payload
          path: payload

      - name: Verify artifact
        shell: bash
        env:
          DOWNLOAD_PATH: ${{ steps.download.outputs.download-path }}
          EXPECTED_PAYLOAD: ${{ env.ARTIFACT_ROUNDTRIP_PAYLOAD }}
          VARIANT: ${{ matrix.variant }}
        run: |
          result=$(cat payload/result.txt)
          result_digest="sha256:$(sha256sum payload/result.txt | cut -d ' ' -f 1)"
          expected_digest="sha256:$(printf '%s\n' "$EXPECTED_PAYLOAD" | sha256sum | cut -d ' ' -f 1)"
          test "$result" = "$EXPECTED_PAYLOAD"
          test "$result_digest" = "$expected_digest"
          [[ "$DOWNLOAD_PATH" == /*/payload ]]
          printf '{"artifact":"%s","variant":"%s","file_digest":"%s"}\n' \
            "$result" "$VARIANT" "$result_digest" > observation.json
          printf '{"artifact":"%s","variant":"%s","file_digest":"%s"}\n' \
            "$EXPECTED_PAYLOAD" "$VARIANT" "$expected_digest" > expected.json
          diff -u expected.json observation.json
          printf 'ARTIFACT_ROUNDTRIP={"artifact":"%s","variant":"%s","file_digest":"%s","download_path":"%s"}\n' \
            "$result" "$VARIANT" "$result_digest" "$DOWNLOAD_PATH"
