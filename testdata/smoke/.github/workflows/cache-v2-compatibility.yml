name: actions/cache v2 compatibility proof

on:
  push:

permissions:
  contents: read

env:
  CACHE_ROUNDTRIP_KEY: cache-v2-compatibility-__CACHE_ROUNDTRIP_NONCE__
  CACHE_ROUNDTRIP_PAYLOAD: cache-v2-compatibility:__CACHE_ROUNDTRIP_NONCE__
  CACHE_ROUNDTRIP_NONCE: __CACHE_ROUNDTRIP_NONCE__

jobs:
  cache-producer:
    runs-on: ubuntu-latest
    steps:
      - name: Restore build-unique cache
        id: cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: cache-data
          key: ${{ env.CACHE_ROUNDTRIP_KEY }}

      - name: Require miss and create payload
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" != true
          test ! -e cache-data/value
          mkdir -p cache-data
          printf '%s\n' "$CACHE_ROUNDTRIP_PAYLOAD" > cache-data/value

  cache-consumer:
    needs: cache-producer
    runs-on: ubuntu-latest
    steps:
      - name: Restore producer cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-data
          key: ${{ env.CACHE_ROUNDTRIP_KEY }}

      - name: Require hit and verify payload
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test "$(cat cache-data/value)" = "$CACHE_ROUNDTRIP_PAYLOAD"
