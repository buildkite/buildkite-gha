name: actions/cache v4 proof

on:
  push:

permissions:
  contents: read

env:
  CACHE_ROUNDTRIP_KEY: cache-v4-roundtrip-__CACHE_ROUNDTRIP_NONCE__
  CACHE_ROUNDTRIP_PAYLOAD: cache-v4-payload:__CACHE_ROUNDTRIP_NONCE__
  CACHE_ROUNDTRIP_NONCE: __CACHE_ROUNDTRIP_NONCE__

jobs:
  cache-producer:
    runs-on: ubuntu-latest
    steps:
      - name: Restore build-unique cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cache-data
          key: ${{ env.CACHE_ROUNDTRIP_KEY }}

      - name: Require miss and create payload
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" != true
          test ! -e cache-data/value
          mkdir -p cache-data
          printf '%s\n' "$CACHE_ROUNDTRIP_PAYLOAD" > cache-data/value

  cache-consumer:
    needs: cache-producer
    runs-on: ubuntu-latest
    steps:
      - name: Restore producer cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cache-data
          key: ${{ env.CACHE_ROUNDTRIP_KEY }}

      - name: Require hit and verify payload
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test "$(cat cache-data/value)" = "$CACHE_ROUNDTRIP_PAYLOAD"
