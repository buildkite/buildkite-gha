name: Experimental cache service

on:
  push:

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Cache payload
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache-data
          key: experimental-cache-fixture-${{ github.sha }}

      - name: Verify restore or create payload
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$CACHE_HIT" == "true" ]]; then
            test "$(cat cache-data/value)" = "deterministic-cache-payload-v1"
            echo "Verified restored cache payload"
          else
            test ! -e cache-data/value
            mkdir -p cache-data
            echo "deterministic-cache-payload-v1" > cache-data/value
            echo "Created cache payload for post-action save"
          fi
