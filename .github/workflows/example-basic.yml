name: Example - basic CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXAMPLE_SUITE: basic

jobs:
  basic:
    name: Basic Go CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          token: ""

      - name: Run focused tests
        id: tests
        shell: bash
        run: |
          go test ./internal/expression ./internal/workflow
          echo "result=passed" >> "$GITHUB_OUTPUT"

      - name: Verify step output
        if: steps.tests.outputs.result == 'passed'
        shell: bash
        env:
          RESULT: ${{ steps.tests.outputs.result }}
        run: test "$RESULT" = passed

      - name: Publish summary
        shell: bash
        run: |
          {
            echo '## Basic CI example'
            echo
            echo 'Checkout, setup-go, conditions, outputs, and focused tests passed.'
          } >> "$GITHUB_STEP_SUMMARY"
