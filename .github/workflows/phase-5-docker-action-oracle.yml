name: Phase 5 Dockerfile action differential oracle

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-action:
    runs-on: ubuntu-latest
    steps:
      - name: Run exact public Dockerfile action
        id: docker
        uses: actions/hello-world-docker-action@66e612e94eca3366d470e868d0c2d86bd25e693d
        with:
          who-to-greet: Phase 5

      - name: Verify Dockerfile action effects
        shell: bash
        env:
          ACTION_TIME: ${{ steps.docker.outputs.time }}
        run: |
          test -n "$ACTION_TIME"
          printf '%s\n' 'PHASE5_DOCKER_OBSERVATION={"container":"ran","output":"propagated","source":"public-exact"}'
