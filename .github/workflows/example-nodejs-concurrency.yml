name: Example - Node.js concurrency

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXAMPLE_SUITE: nodejs-concurrency

concurrency:
  group: ci-${{ github.ref }}

jobs:
  build-check-test:
    name: Node.js CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: "false"
          token: ""

      - name: Verify Node.js
        shell: bash
        run: node --version | grep '^v22\.'
