name: Phase 4 smoke composite action
description: Exercises composite inputs, outputs, and environment propagation.

inputs:
  message:
    description: Value to transform.
    required: true

outputs:
  result:
    description: Transformed value.
    value: ${{ steps.transform.outputs.result }}

runs:
  using: composite
  steps:
    - name: Transform value
      id: transform
      shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
      run: |
        echo "result=$MESSAGE-composite" >> "$GITHUB_OUTPUT"
        echo "SMOKE_COMPOSITE_SEEN=true" >> "$GITHUB_ENV"
