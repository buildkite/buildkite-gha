name: Run-attempt condition oracle
description: Select opposite composite branches on first execution and rerun
outputs:
  value:
    description: Selected attempt branch
    value: ${{ steps.first.outputs.value || steps.retry.outputs.value }}
runs:
  using: composite
  steps:
    - id: first
      if: github.run_attempt == '1'
      shell: bash
      run: echo value=first >> "$GITHUB_OUTPUT"
    - id: retry
      if: github.run_attempt != '1'
      shell: bash
      run: echo value=retry >> "$GITHUB_OUTPUT"
