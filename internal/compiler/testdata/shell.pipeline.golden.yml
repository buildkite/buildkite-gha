      queue: "gha-untrusted"
    checkout:
      skip: true
    env:
      BUILDKITE_GHA_PLAN_DIGEST: "sha256:ab40f43aa8698986e68a642f3a6e19d8495758132ecaf602e824ad68aa472b5f"
      BUILDKITE_GHA_PLAN_PATH: ".buildkite-gha/plans/ab40f43aa8698986e68a642f3a6e19d8495758132ecaf602e824ad68aa472b5f.json"
