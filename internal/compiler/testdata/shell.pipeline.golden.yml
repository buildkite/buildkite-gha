    agents:
      queue: "gha-untrusted"
    checkout:
      skip: true
    env:
      BUILDKITE_GHA_PLAN_DIGEST: "sha256:72c64153848c880724027273a3c483e0e19002899c2a14b3f025e65b4491ea4d"
      BUILDKITE_GHA_PLAN_PATH: ".buildkite-gha/plans/72c64153848c880724027273a3c483e0e19002899c2a14b3f025e65b4491ea4d.json"
