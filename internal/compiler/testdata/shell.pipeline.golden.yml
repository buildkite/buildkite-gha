steps:
  - label: "producer"
    key: "gha-producer"
    command: "set -euo pipefail\nbootstrap_dir=\"$(mktemp -d \"${TMPDIR:-/tmp}/buildkite-gha.XXXXXXXX\")\"\ntrap 'rm -rf -- \"$bootstrap_dir\"' EXIT\nbuildkite-agent artifact download '.buildkite-gha/distributions/2222222222222222222222222222222222222222222222222222222222222222/buildkite-gha' \"$bootstrap_dir\" --step 'gha-importer'\nbuildkite-agent artifact download '.buildkite-gha/plans/2c7d5674939b9471aa5e2c9e7a33e3280ae2493577346d6f56eecdaedcc79814.json' \"$bootstrap_dir\" --step 'gha-importer'\ndistribution=\"$bootstrap_dir/.buildkite-gha/distributions/2222222222222222222222222222222222222222222222222222222222222222/buildkite-gha\"\nplan=\"$bootstrap_dir/.buildkite-gha/plans/2c7d5674939b9471aa5e2c9e7a33e3280ae2493577346d6f56eecdaedcc79814.json\"\nactual_distribution_digest=\"$(sha256sum \"$distribution\" | awk '{print \"sha256:\" $1}')\"\ntest \"$actual_distribution_digest\" = 'sha256:2222222222222222222222222222222222222222222222222222222222222222'\nchmod 0500 \"$distribution\"\n\"$distribution\" run-job --plan \"$plan\""
    checkout:
      skip: true
    env:
      BUILDKITE_GHA_PLAN_DIGEST: "sha256:2c7d5674939b9471aa5e2c9e7a33e3280ae2493577346d6f56eecdaedcc79814"
      BUILDKITE_GHA_PLAN_PATH: ".buildkite-gha/plans/2c7d5674939b9471aa5e2c9e7a33e3280ae2493577346d6f56eecdaedcc79814.json"
      BUILDKITE_GHA_PLAN_PRODUCER: "gha-importer"
    depends_on:
      - step: "gha-importer"
        allow_failure: false
