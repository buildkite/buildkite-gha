steps:
  - label: "producer"
    key: "gha-producer"
    command: "set -euo pipefail\nbootstrap_dir=\"$(mktemp -d \"${TMPDIR:-/tmp}/buildkite-gha.XXXXXXXX\")\"\ntrap 'rm -rf -- \"$bootstrap_dir\"' EXIT\nbuildkite-agent artifact download '.buildkite-gha/distributions/2222222222222222222222222222222222222222222222222222222222222222/buildkite-gha' \"$bootstrap_dir\" --step 'gha-importer'\nbuildkite-agent artifact download '.buildkite-gha/plans/2a9b179ecc1a074d2d29b02d2751f5b67137d16877c64459cad0b6dee9bcbde3.json' \"$bootstrap_dir\" --step 'gha-importer'\ndistribution=\"$bootstrap_dir/.buildkite-gha/distributions/2222222222222222222222222222222222222222222222222222222222222222/buildkite-gha\"\nplan=\"$bootstrap_dir/.buildkite-gha/plans/2a9b179ecc1a074d2d29b02d2751f5b67137d16877c64459cad0b6dee9bcbde3.json\"\nactual_distribution_digest=\"$(sha256sum \"$distribution\" | awk '{print \"sha256:\" $1}')\"\ntest \"$actual_distribution_digest\" = 'sha256:2222222222222222222222222222222222222222222222222222222222222222'\nchmod 0500 \"$distribution\"\n\"$distribution\" run-job --plan \"$plan\""
    agents:
      queue: "gha-untrusted"
    checkout:
      skip: true
    env:
      BUILDKITE_GHA_PLAN_DIGEST: "sha256:2a9b179ecc1a074d2d29b02d2751f5b67137d16877c64459cad0b6dee9bcbde3"
      BUILDKITE_GHA_PLAN_PATH: ".buildkite-gha/plans/2a9b179ecc1a074d2d29b02d2751f5b67137d16877c64459cad0b6dee9bcbde3.json"
      BUILDKITE_GHA_PLAN_PRODUCER: "gha-importer"
    depends_on:
      - step: "gha-importer"
        allow_failure: false
