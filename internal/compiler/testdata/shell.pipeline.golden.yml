    command: "set -euo pipefail\nbootstrap_dir=\"$(mktemp -d \"${TMPDIR:-/tmp}/buildkite-gha.XXXXXXXX\")\"\ntrap 'rm -rf -- \"$bootstrap_dir\"' EXIT\nbuildkite-agent artifact download '.buildkite-gha/distributions/2222222222222222222222222222222222222222222222222222222222222222/buildkite-gha' \"$bootstrap_dir\" --step 'gha-importer'\nbuildkite-agent artifact download '.buildkite-gha/plans/2cfa76df9b0c05d2e67bb73173fe047e78a3b7f406c183679d338e9fe0402a06.json' \"$bootstrap_dir\" --step 'gha-importer'\ndistribution=\"$bootstrap_dir/.buildkite-gha/distributions/2222222222222222222222222222222222222222222222222222222222222222/buildkite-gha\"\nplan=\"$bootstrap_dir/.buildkite-gha/plans/2cfa76df9b0c05d2e67bb73173fe047e78a3b7f406c183679d338e9fe0402a06.json\"\nif command -v sha256sum \u003e/dev/null 2\u003e\u00261; then actual_distribution_digest=\"$(sha256sum \"$distribution\" | awk '{print \"sha256:\" $1}')\"; elif command -v shasum \u003e/dev/null 2\u003e\u00261; then actual_distribution_digest=\"$(shasum -a 256 \"$distribution\" | awk '{print \"sha256:\" $1}')\"; else echo 'buildkite-gha: no SHA-256 tool available' \u003e\u00262; exit 1; fi\ntest \"$actual_distribution_digest\" = 'sha256:2222222222222222222222222222222222222222222222222222222222222222'\nchmod 0500 \"$distribution\"\n\"$distribution\" run-job --plan \"$plan\""
    checkout:
      skip: true
    env:
      BUILDKITE_GHA_PLAN_DIGEST: "sha256:2cfa76df9b0c05d2e67bb73173fe047e78a3b7f406c183679d338e9fe0402a06"
      BUILDKITE_GHA_PLAN_PATH: ".buildkite-gha/plans/2cfa76df9b0c05d2e67bb73173fe047e78a3b7f406c183679d338e9fe0402a06.json"
      BUILDKITE_GHA_PLAN_PRODUCER: "gha-importer"
    depends_on:
      - step: "gha-importer"
        allow_failure: false
      - step: "gha-producer"
        allow_failure: true
