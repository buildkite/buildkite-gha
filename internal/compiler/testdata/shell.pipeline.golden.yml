steps:
  - label: "producer"
    key: "gha-producer"
    command: "set -euo pipefail\nbootstrap_dir=\"$(mktemp -d \"${TMPDIR:-/tmp}/buildkite-gha.XXXXXXXX\")\"\ntrap 'rm -rf -- \"$bootstrap_dir\"' EXIT\nbuildkite-agent artifact download '.buildkite-gha/distributions/2222222222222222222222222222222222222222222222222222222222222222/buildkite-gha' \"$bootstrap_dir\" --step 'gha-importer'\ndistribution=\"$bootstrap_dir/.buildkite-gha/distributions/2222222222222222222222222222222222222222222222222222222222222222/buildkite-gha\"\nif command -v sha256sum \u003e/dev/null 2\u003e\u00261; then actual_distribution_digest=\"$(sha256sum \"$distribution\" | awk '{print \"sha256:\" $1}')\"; elif command -v shasum \u003e/dev/null 2\u003e\u00261; then actual_distribution_digest=\"$(shasum -a 256 \"$distribution\" | awk '{print \"sha256:\" $1}')\"; else echo 'buildkite-gha: no SHA-256 tool available' \u003e\u00262; exit 1; fi\ntest \"$actual_distribution_digest\" = 'sha256:2222222222222222222222222222222222222222222222222222222222222222'\nchmod 0500 \"$distribution\"\n\"$distribution\" run-job --plan-digest 'sha256:abb17c90ef0776497e3740045cb017113b24d0cf7331a728f0db70f4df9247c5' --plan-producer 'gha-importer'"
    checkout:
      skip: true
    depends_on:
      - step: "gha-importer"
        allow_failure: false
