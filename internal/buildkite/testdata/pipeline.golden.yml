steps:
  - label: "Producer"
    key: "gha-producer"
    command: "set -euo pipefail\ncommand -v mise \u003e/dev/null 2\u003e\u00261 || { echo \"buildkite-gha: mise is required to run JavaScript actions\" \u003e\u00262; exit 1; }\nbootstrap_dir=\"$(mktemp -d \"${TMPDIR:-/tmp}/buildkite-gha.XXXXXXXX\")\"\ntrap 'rm -rf -- \"$bootstrap_dir\"' EXIT\nbuildkite-agent artifact download '.buildkite-gha/distributions/06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d/buildkite-gha' \"$bootstrap_dir\" --step 'gha-importer'\nbuildkite-agent artifact download '.buildkite-gha/plans/591e07fdba7d05faf56f9dda91d5eb28d16f324799a667ec3d1e68ae0665292f.json' \"$bootstrap_dir\" --step 'gha-importer'\ndistribution=\"$bootstrap_dir/.buildkite-gha/distributions/06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d/buildkite-gha\"\nplan=\"$bootstrap_dir/.buildkite-gha/plans/591e07fdba7d05faf56f9dda91d5eb28d16f324799a667ec3d1e68ae0665292f.json\"\nactual_distribution_digest=\"$(sha256sum \"$distribution\" | awk '{print \"sha256:\" $1}')\"\ntest \"$actual_distribution_digest\" = 'sha256:06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d'\nchmod 0500 \"$distribution\"\n\"$distribution\" run-job --plan \"$plan\""
    agents:
      queue: "gha-linux"
    checkout:
      skip: true
    env:
      BUILDKITE_GHA_PLAN_DIGEST: "sha256:591e07fdba7d05faf56f9dda91d5eb28d16f324799a667ec3d1e68ae0665292f"
      BUILDKITE_GHA_PLAN_PATH: ".buildkite-gha/plans/591e07fdba7d05faf56f9dda91d5eb28d16f324799a667ec3d1e68ae0665292f.json"
      BUILDKITE_GHA_PLAN_PRODUCER: "gha-importer"
    depends_on:
      - step: "gha-importer"
        allow_failure: false
  - label: "Consumer (variant=one)"
    key: "gha-consumer-one"
    command: "set -euo pipefail\ncommand -v mise \u003e/dev/null 2\u003e\u00261 || { echo \"buildkite-gha: mise is required to run JavaScript actions\" \u003e\u00262; exit 1; }\nbootstrap_dir=\"$(mktemp -d \"${TMPDIR:-/tmp}/buildkite-gha.XXXXXXXX\")\"\ntrap 'rm -rf -- \"$bootstrap_dir\"' EXIT\nbuildkite-agent artifact download '.buildkite-gha/distributions/06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d/buildkite-gha' \"$bootstrap_dir\" --step 'gha-importer'\nbuildkite-agent artifact download '.buildkite-gha/plans/c097b0b78bdbb6d837314048161418606c7f123242fee95967b48998dd6b2a0c.json' \"$bootstrap_dir\" --step 'gha-importer'\ndistribution=\"$bootstrap_dir/.buildkite-gha/distributions/06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d/buildkite-gha\"\nplan=\"$bootstrap_dir/.buildkite-gha/plans/c097b0b78bdbb6d837314048161418606c7f123242fee95967b48998dd6b2a0c.json\"\nactual_distribution_digest=\"$(sha256sum \"$distribution\" | awk '{print \"sha256:\" $1}')\"\ntest \"$actual_distribution_digest\" = 'sha256:06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d'\nchmod 0500 \"$distribution\"\n\"$distribution\" run-job --plan \"$plan\""
    agents:
      queue: "gha-linux"
    checkout:
      skip: true
    env:
      BUILDKITE_GHA_PLAN_DIGEST: "sha256:c097b0b78bdbb6d837314048161418606c7f123242fee95967b48998dd6b2a0c"
      BUILDKITE_GHA_PLAN_PATH: ".buildkite-gha/plans/c097b0b78bdbb6d837314048161418606c7f123242fee95967b48998dd6b2a0c.json"
      BUILDKITE_GHA_PLAN_PRODUCER: "gha-importer"
    concurrency: 2
    concurrency_group: "buildkite-gha/shell/consumer"
    depends_on:
      - step: "gha-importer"
        allow_failure: false
      - step: "gha-producer"
        allow_failure: true
  - label: "Consumer ($VALUE, variant=\"two\")"
    key: "gha-consumer-two"
    command: "set -euo pipefail\ncommand -v mise \u003e/dev/null 2\u003e\u00261 || { echo \"buildkite-gha: mise is required to run JavaScript actions\" \u003e\u00262; exit 1; }\nbootstrap_dir=\"$(mktemp -d \"${TMPDIR:-/tmp}/buildkite-gha.XXXXXXXX\")\"\ntrap 'rm -rf -- \"$bootstrap_dir\"' EXIT\nbuildkite-agent artifact download '.buildkite-gha/distributions/06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d/buildkite-gha' \"$bootstrap_dir\" --step 'gha-importer'\nbuildkite-agent artifact download '.buildkite-gha/plans/34fed30c7e0cef60eae62467fdddf2990ac6f6f6fa0145f7eed8fbe9c6e4fdfd.json' \"$bootstrap_dir\" --step 'gha-importer'\ndistribution=\"$bootstrap_dir/.buildkite-gha/distributions/06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d/buildkite-gha\"\nplan=\"$bootstrap_dir/.buildkite-gha/plans/34fed30c7e0cef60eae62467fdddf2990ac6f6f6fa0145f7eed8fbe9c6e4fdfd.json\"\nactual_distribution_digest=\"$(sha256sum \"$distribution\" | awk '{print \"sha256:\" $1}')\"\ntest \"$actual_distribution_digest\" = 'sha256:06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d'\nchmod 0500 \"$distribution\"\n\"$distribution\" run-job --plan \"$plan\""
    agents:
