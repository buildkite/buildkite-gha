steps:
  - label: "Producer"
    key: "gha-producer"
    command: "set -euo pipefail\necho '~~~ :package: Prepare GitHub Actions runtime'\nbootstrap_exit() { bootstrap_status=$?; if [ \"$bootstrap_status\" -ne 0 ]; then echo \"^^^ +++\"; fi; if [ -n \"${bootstrap_dir:-}\" ]; then rm -rf -- \"$bootstrap_dir\" || true; fi; exit \"$bootstrap_status\"; }\ntrap bootstrap_exit EXIT\nbootstrap_dir=\"$(mktemp -d \"${TMPDIR:-/tmp}/buildkite-gha.XXXXXXXX\")\"\nbuildkite-agent artifact download '.buildkite-gha/distributions/06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d/buildkite-gha' \"$bootstrap_dir\" --step 'gha-importer'\ndistribution=\"$bootstrap_dir/.buildkite-gha/distributions/06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d/buildkite-gha\"\nif command -v sha256sum \u003e/dev/null 2\u003e\u00261; then actual_distribution_digest=\"$(sha256sum \"$distribution\" | awk '{print \"sha256:\" $1}')\"; elif command -v shasum \u003e/dev/null 2\u003e\u00261; then actual_distribution_digest=\"$(shasum -a 256 \"$distribution\" | awk '{print \"sha256:\" $1}')\"; else echo 'buildkite-gha: no SHA-256 tool available' \u003e\u00262; exit 1; fi\ntest \"$actual_distribution_digest\" = 'sha256:06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d'\nchmod 0500 \"$distribution\"\ntrap 'rm -rf -- \"$bootstrap_dir\"' EXIT\nunset -f bootstrap_exit\n\"$distribution\" run-job --plan-digest 'sha256:591e07fdba7d05faf56f9dda91d5eb28d16f324799a667ec3d1e68ae0665292f' --plan-producer 'gha-importer'"
    agents:
      queue: "gha-linux"
    checkout:
      skip: true
    depends_on:
      - step: "gha-importer"
        allow_failure: false
  - label: "Consumer (variant=one)"
    key: "gha-consumer-one"
    command: "set -euo pipefail\necho '~~~ :package: Prepare GitHub Actions runtime'\nbootstrap_exit() { bootstrap_status=$?; if [ \"$bootstrap_status\" -ne 0 ]; then echo \"^^^ +++\"; fi; if [ -n \"${bootstrap_dir:-}\" ]; then rm -rf -- \"$bootstrap_dir\" || true; fi; exit \"$bootstrap_status\"; }\ntrap bootstrap_exit EXIT\nbootstrap_dir=\"$(mktemp -d \"${TMPDIR:-/tmp}/buildkite-gha.XXXXXXXX\")\"\nbuildkite-agent artifact download '.buildkite-gha/distributions/06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d/buildkite-gha' \"$bootstrap_dir\" --step 'gha-importer'\ndistribution=\"$bootstrap_dir/.buildkite-gha/distributions/06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d/buildkite-gha\"\nif command -v sha256sum \u003e/dev/null 2\u003e\u00261; then actual_distribution_digest=\"$(sha256sum \"$distribution\" | awk '{print \"sha256:\" $1}')\"; elif command -v shasum \u003e/dev/null 2\u003e\u00261; then actual_distribution_digest=\"$(shasum -a 256 \"$distribution\" | awk '{print \"sha256:\" $1}')\"; else echo 'buildkite-gha: no SHA-256 tool available' \u003e\u00262; exit 1; fi\ntest \"$actual_distribution_digest\" = 'sha256:06a952242a2b037f91987e0f89355658661789d18537a288d62834af1137876d'\nchmod 0500 \"$distribution\"\ntrap 'rm -rf -- \"$bootstrap_dir\"' EXIT\nunset -f bootstrap_exit\n\"$distribution\" run-job --plan-digest 'sha256:c097b0b78bdbb6d837314048161418606c7f123242fee95967b48998dd6b2a0c' --plan-producer 'gha-importer'"
    agents:
      queue: "gha-linux"
    checkout:
      skip: true
    concurrency: 2
    concurrency_group: "buildkite-gha/shell/consumer"
    depends_on:
      - step: "gha-importer"
        allow_failure: false
      - step: "gha-producer"
        allow_failure: true
