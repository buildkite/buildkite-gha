[tools]
go = "1.26.5"
golangci-lint = "2.12.2"
jq = "1.8.2"
node = ["24.18.0", "20.20.2"]
shellcheck = "0.11.0"
goreleaser = "2.17.0"
svu = "3.4.1"

[env]
GOTOOLCHAIN = "local"

[tasks.format]
description = "Check Go formatting"
run = '''
unformatted="$(gofmt -l .)"
test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
'''

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks."test:race"]
description = "Run the race-enabled Go test suite"
run = "go test -race ./..."

[tasks."lint:go"]
description = "Lint Go code"
run = "golangci-lint run"

[tasks."lint:shell"]
description = "Lint shell scripts"
run = "shellcheck -x .buildkite/phase-0-transport-probe/probe.sh scripts/ci-buildkite-release scripts/migration-poc-import scripts/phase-0-shell-oracle-checkout scripts/phase-0-sign-json scripts/phase-0-verify-json scripts/phase-5-hosted-docker-probe scripts/phase-5-hosted-runtime-probe scripts/phase-6-artifact-roundtrip-verify scripts/phase-6-cache-roundtrip-verify scripts/phase-6-summary-annotation-verify scripts/phase-6-upload-artifact-verify scripts/phase-6-workflow-annotations-verify scripts/release scripts/smoke-local testdata/actions/docker/entrypoint.sh testdata/phase5/runtime/.github/actions/docker/entrypoint.sh"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.build]
description = "Build all Go commands"
run = "go build ./..."

[tasks.release]
description = "Tag and push the next pre-1.0 release"
depends = ["check"]
run = "scripts/release"

[tasks."release:check"]
description = "Validate the release configuration"
run = "goreleaser check"

[tasks.plan-fixtures]
description = "Validate signed plan-envelope fixtures"
run = "python3 testdata/plans/validate.py"

[tasks."smoke:local"]
description = "Validate and deterministically compile the local smoke inventory"
run = "./scripts/smoke-local"

[tasks."smoke:profile"]
description = "Resolve actions and apply the hosted-tokenless profile to smoke fixtures"
run = "./scripts/smoke-local --profile hosted-tokenless"

[tasks.check]
description = "Run formatting, build, tests, lint, vet, and fixture checks"
run = "mise run --jobs 1 format ::: build ::: test ::: test:race ::: lint:go ::: lint:shell ::: vet ::: plan-fixtures ::: smoke:local ::: release:check"
