[tools]
go = "1.27.0"
golangci-lint = "2.13.1"
jq = "1.8.2"
node = ["24.18.0", "20.20.2"]
shellcheck = "0.11.0"
goreleaser = "2.17.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

[settings]
lockfile = true

[env]
GOTOOLCHAIN = "local"

[tasks.format]
description = "Check Go formatting"
run = '''
echo '--- Check formatting'
unformatted="$(gofmt -l .)"
test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
'''

[tasks.test]
description = "Run the Go test suite"
run = "echo '--- Run tests'; go test ./..."

[tasks."test:race"]
description = "Run the race-enabled Go test suite"
run = "echo '--- Run race tests'; go test -race ./..."

[tasks."lint:go"]
description = "Lint Go code"
run = "echo '--- Lint Go'; golangci-lint run"

[tasks."lint:shell"]
description = "Lint shell scripts"
run = "echo '--- Lint shell'; shellcheck -x .buildkite/upload-examples.sh scripts/ci-buildkite-release scripts/compare-example scripts/compatibility-gaps scripts/starter-workflows-corpus scripts/validate-public-workflow-corpus scripts/verify-source-checkout scripts/hosted-docker-probe scripts/container-runtime-probe scripts/verify-summary-annotation scripts/verify-workflow-annotations scripts/verify-upload-artifact scripts/verify-artifact-roundtrip scripts/release scripts/release-test scripts/smoke-local testdata/actions/docker/entrypoint.sh testdata/container-runtime/.github/actions/docker/entrypoint.sh"

[tasks.lint]
description = "Lint Go code and shell scripts"
depends = ["lint:go", "lint:shell"]

[tasks.vet]
description = "Run go vet"
run = "echo '--- Vet Go'; go vet ./..."

[tasks.vulnerability]
description = "Check Go dependencies and the standard library for reachable vulnerabilities"
run = "echo '--- Check vulnerabilities'; govulncheck ./..."

[tasks.build]
description = "Build all Go commands"
run = "echo '--- Build Linux'; go build ./..."

[tasks."build:darwin"]
description = "Cross-build all Go commands for native macOS arm64"
run = "echo '--- Build macOS arm64'; GOOS=darwin GOARCH=arm64 go build ./..."

[tasks.release]
description = "Tag and push the next pre-1.0 release"
depends = ["check"]
run = "scripts/release"

[tasks."release:check"]
description = "Validate the release configuration"
run = "echo '--- Check release configuration'; goreleaser check && scripts/release-test"

[tasks."smoke:local"]
description = "Validate and deterministically compile the local smoke inventory"
run = "echo '--- Run local smoke tests'; ./scripts/smoke-local"

[tasks."smoke:profile"]
description = "Resolve actions and apply the hosted profile to smoke fixtures"
run = "./scripts/smoke-local --profile hosted"

[tasks."compatibility:gaps"]
description = "Assess the documented compatibility gaps"
run = "./scripts/compatibility-gaps"

[tasks."corpus:starter"]
description = "Report compile compatibility for the pinned GitHub starter workflow corpus"
run = "./scripts/starter-workflows-corpus"

[tasks."corpus:starter-profile"]
description = "Report hosted admission for the pinned GitHub starter workflow corpus"
run = "./scripts/starter-workflows-corpus --profile"

[tasks."corpus:public"]
description = "Validate the public GitHub Actions workflow corpus"
dir = "{{cwd}}"
run = '"$MISE_CONFIG_ROOT/scripts/validate-public-workflow-corpus"'

[tasks.check]
description = "Run formatting, build, tests, lint, vet, and fixture checks"
run = "mise run --jobs 1 format ::: build ::: build:darwin ::: test ::: test:race ::: lint ::: vet ::: vulnerability ::: smoke:local ::: release:check"

[tasks."check:ci"]
description = "Run CI checks not covered by the Test Engine step"
run = "mise run --jobs 1 format ::: build ::: build:darwin ::: test:race ::: lint ::: vet ::: vulnerability ::: smoke:local ::: release:check"
