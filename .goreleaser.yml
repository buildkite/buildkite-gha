version: 2

builds:
  - id: buildkite-gha-linux
    main: ./cmd/buildkite-gha
    binary: buildkite-gha
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/buildkite/buildkite-gha/internal/telemetry.BugsnagAPIKey={{ envOrDefault "BUGSNAG_API_KEY" "" }}
  - id: buildkite-gha-linux-arm64
    main: ./cmd/buildkite-gha
    binary: buildkite-gha
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/buildkite/buildkite-gha/internal/telemetry.BugsnagAPIKey={{ envOrDefault "BUGSNAG_API_KEY" "" }}
  - id: buildkite-gha-darwin
    main: ./cmd/buildkite-gha
    binary: buildkite-gha
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/buildkite/buildkite-gha/internal/telemetry.BugsnagAPIKey={{ envOrDefault "BUGSNAG_API_KEY" "" }}
  - id: buildkite-gha-windows
    main: ./cmd/buildkite-gha
    binary: buildkite-gha
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/buildkite/buildkite-gha/internal/telemetry.BugsnagAPIKey={{ envOrDefault "BUGSNAG_API_KEY" "" }}

archives:
  - id: buildkite-gha
    ids: [buildkite-gha-linux]
    formats: [binary]
    name_template: buildkite-gha_linux_x86_64
  - id: buildkite-gha-darwin-archive
    ids: [buildkite-gha-darwin]
    formats: [binary]
    name_template: buildkite-gha_darwin_arm64
  - id: buildkite-gha-linux-arm64-archive
    ids: [buildkite-gha-linux-arm64]
    formats: [binary]
    name_template: buildkite-gha_linux_arm64
  - id: buildkite-gha-windows-archive
    ids: [buildkite-gha-windows]
    formats: [binary]
    name_template: buildkite-gha_windows_x86_64

checksum:
  name_template: checksums.txt

release:
  name_template: "{{ .Tag }}"
  # The publisher creates and verifies the tag first. A historical target here
  # can require Workflows write permission even though the tag already exists.
  use_existing_draft: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs(?:\\([^)]*\\))?:"
      - "^test(?:\\([^)]*\\))?:"
      - "^chore(?:\\([^)]*\\))?:"
      - "^ci(?:\\([^)]*\\))?:"
      - "^Merge "
