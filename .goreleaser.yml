version: 2

builds:
  - id: buildkite-gha-linux
    main: ./cmd/buildkite-gha
    binary: buildkite-gha
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: buildkite-gha
    ids: [buildkite-gha-linux]
    formats: [tar.gz]
    name_template: buildkite-gha_Linux_x86_64
    files:
      - src: LICENSE
      - src: .release/runtimes/node20/bin/node
        dst: runtimes/node20/bin/node
      - src: .release/runtimes/node20/LICENSE
        dst: runtimes/node20/LICENSE
      - src: .release/runtimes/node24/bin/node
        dst: runtimes/node24/bin/node
      - src: .release/runtimes/node24/LICENSE
        dst: runtimes/node24/LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs(?:\\([^)]*\\))?:"
      - "^test(?:\\([^)]*\\))?:"
      - "^chore(?:\\([^)]*\\))?:"
      - "^ci(?:\\([^)]*\\))?:"
      - "^Merge "
